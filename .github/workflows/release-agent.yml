name: Release Scanner Agent

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 2.1.0 or v2.1.0)'
        required: true
        default: 'v2.1.0'
      draft:
        description: 'Create as draft release'
        type: boolean
        required: false
        default: false
      prerelease:
        description: 'Create as pre-release'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  # ─── 1. Build Windows x64 Binary ──────────────────────────────────────────
  build-windows:
    name: Build Windows Binary (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Build Tool (pkg)
        run: npm install -g @yao-pkg/pkg

      - name: Validate Agent Script
        run: node --check service.js

      - name: Build ScannerAgent.exe
        run: |
          mkdir -p dist
          pkg service.js --target node22.23.2-win-x64 --output dist/ScannerAgent.exe --compress GZip

      - name: Generate SHA-256 Checksum
        shell: pwsh
        working-directory: dist
        run: |
          $hash = (Get-FileHash -Path "ScannerAgent.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  ScannerAgent.exe" | Out-File -FilePath "ScannerAgent.exe.sha256" -Encoding utf8
          Write-Host "Windows Binary SHA-256: $hash"

      - name: Package Windows Bundle (ZIP)
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          if ($version -notmatch "^v") {
            $version = "${{ github.event.inputs.version }}"
          }
          if (-not $version) {
            $version = "latest"
          }
          $bundleDir = "ScannerAgent-$version-windows-x64"
          New-Item -ItemType Directory -Force -Path $bundleDir
          Copy-Item -Path "dist/ScannerAgent.exe" -Destination "$bundleDir/"
          Copy-Item -Path "dist/ScannerAgent.exe.sha256" -Destination "$bundleDir/"
          Copy-Item -Path "config.json" -Destination "$bundleDir/"
          Copy-Item -Path "readme.md" -Destination "$bundleDir/"
          if (Test-Path "installer") {
            Copy-Item -Path "installer" -Destination "$bundleDir/" -Recurse
          }
          Compress-Archive -Path "$bundleDir/*" -DestinationPath "ScannerAgent-$version-windows-x64.zip" -Force

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: scanner-agent-windows-x64
          path: |
            dist/ScannerAgent.exe
            dist/ScannerAgent.exe.sha256
            ScannerAgent-*-windows-x64.zip
          retention-days: 7

  # ─── 2. Build Linux x64 Binary ─────────────────────────────────────────────
  build-linux:
    name: Build Linux Binary (ELF)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Build Tool (pkg)
        run: sudo npm install -g @yao-pkg/pkg

      - name: Validate Agent Script
        run: node --check service.js

      - name: Build scanner-agent-linux
        run: |
          mkdir -p dist
          pkg service.js --target node22.23.2-linux-x64 --output dist/scanner-agent-linux --compress GZip
          chmod +x dist/scanner-agent-linux

      - name: Generate SHA-256 Checksum
        working-directory: dist
        run: |
          sha256sum scanner-agent-linux > scanner-agent-linux.sha256
          cat scanner-agent-linux.sha256

      - name: Package Linux Bundle (tar.gz)
        run: |
          VERSION="${{ github.ref_name }}"
          if [[ ! $VERSION == v* ]]; then
            VERSION="${{ github.event.inputs.version }}"
          fi
          if [[ -z "$VERSION" ]]; then
            VERSION="latest"
          fi
          BUNDLE_DIR="ScannerAgent-${VERSION}-linux-x64"
          mkdir -p "$BUNDLE_DIR"
          cp dist/scanner-agent-linux "$BUNDLE_DIR/"
          cp dist/scanner-agent-linux.sha256 "$BUNDLE_DIR/"
          cp config.json "$BUNDLE_DIR/"
          cp readme.md "$BUNDLE_DIR/"
          cp start-linux.sh "$BUNDLE_DIR/"
          tar -czvf "ScannerAgent-${VERSION}-linux-x64.tar.gz" -C "$BUNDLE_DIR" .

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: scanner-agent-linux-x64
          path: |
            dist/scanner-agent-linux
            dist/scanner-agent-linux.sha256
            ScannerAgent-*-linux-x64.tar.gz
          retention-days: 7

  # ─── 3. Consolidated GitHub Release ───────────────────────────────────────
  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Display Release Assets
        run: ls -la release-assets

      - name: Create Consolidated Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || github.event.inputs.version }}
          name: Scanner Agent ${{ github.ref_name || github.event.inputs.version }}
          draft: ${{ github.event.inputs.draft || false }}
          prerelease: ${{ github.event.inputs.prerelease || false }}
          generate_release_notes: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
